<html lang="hu">
<head>

<style>
:root{--ink:#293d3a;--muted:#71817b;--forest:#3d675b;--forest-dark:#2c5146;--canvas:#e9e5da;--white:#fffefa;--border:#d9dfd6;--shadow:0 18px 50px rgba(28,51,42,.12);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
.app-shell{display:flex;min-height:100dvh}.sidebar{width:264px;flex:none;background:#f8f8f1;border-right:1px solid #d8ddd4;display:flex;flex-direction:column;padding:22px 15px 18px;gap:16px;z-index:20}.brand{padding:0 10px 14px;border-bottom:1px solid #dde2d8}.brand-row{display:flex;gap:10px;align-items:center}.brand-icon{width:43px;height:43px;border-radius:12px;background:var(--forest);color:white;display:grid;place-items:center;font-size:23px;font-family:Georgia,serif}.brand-text{font-family:Georgia,serif;font-size:23px;font-weight:700}.brand-tag{font-size:12px;color:var(--muted);margin:4px 0 0 53px}.btn{border:1px solid #d5ddd3;background:#fffef9;color:#445d52;padding:9px 13px;border-radius:10px;font-size:13px;font-weight:700;min-height:38px}.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}.btn.primary:hover{background:var(--forest-dark)}.btn.wide{width:100%}.btn.danger{color:#a64b48;border-color:#e7d3cd}.small-heading{font-size:11px;font-weight:800;letter-spacing:1.3px;color:#89958d;text-transform:uppercase;margin:0 9px}.notebook-list{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}.notebook-item{width:100%;display:flex;gap:11px;align-items:center;padding:11px;border:1px solid transparent;border-radius:13px;text-align:left;background:transparent;color:var(--ink)}.notebook-item:hover{background:#eef1e9}.notebook-item.selected{background:#e4eee8;border-color:#c4d8cb}.mini-cover{width:34px;height:43px;border-radius:3px 6px 6px 3px;flex:none;background:var(--cover);box-shadow:2px 3px 4px #263f3430,inset 4px 0 0 #ffffff30}.nb-title{display:block;font-size:14px;font-weight:750}.nb-sub{font-size:12px;color:#77857c;display:block;margin-top:3px}.side-bottom{margin-top:auto;border-top:1px solid #dde2d8;padding:14px 9px 0;color:#7d8a82;font-size:12px;line-height:1.5}.side-bottom a{color:var(--forest);font-weight:750}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:18px 25px 10px;flex-wrap:wrap}.title-container{min-width:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--forest);font-weight:800;margin:0 0 3px}.heading{font-family:Georgia,serif;font-size:28px;margin:0}.subheading{margin:4px 0 0;font-size:12px;color:#788981}.top-actions,.tool-group,.nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar{margin:4px 24px 0;padding:10px 12px;background:#f7f8f1;border:1px solid #dce2d7;border-radius:15px;display:flex;gap:10px;flex-wrap:wrap}.tool-group{padding-right:10px;border-right:1px solid #dce1d9;gap:6px}.tool-caption{font-size:11px;color:#7f8d84;font-weight:700}.mode-btn{font-size:13px;border:1px solid transparent;border-radius:9px;padding:8px 10px;background:transparent;color:#536a5e}.mode-btn.active{background:#dceae1;border-color:#bfd6c7;color:#2e5546;font-weight:750}select{background:#fff;color:#425d53;border:1px solid #d4ded3;border-radius:9px;padding:8px 7px;font-size:12px}.ink-input{height:34px;width:36px;border:1px solid #cad8ca;background:transparent;border-radius:8px}.width-input{width:70px;accent-color:var(--forest)}.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 23px 36px}.desk-note{color:#87938b;text-align:center;font-size:12px;margin:0 0 13px}.book-slot{width:min(100%,1040px);display:flex;justify-content:center;align-items:center;filter:drop-shadow(0 18px 18px #49574d21)}.book-spread{width:100%;display:flex;justify-content:center;position:relative}.book-spread::before{content:"";position:absolute;z-index:4;pointer-events:none;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(40,49,42,.19),rgba(255,255,255,.27),transparent)}.paper-page{width:50%;height:clamp(450px,62vh,660px);position:relative;background:#fffcf3;overflow:hidden;box-shadow:inset 0 0 22px #9c876c14,0 4px 7px #283a2920;border:1px solid #e3dcd1}.paper-page.left{border-radius:13px 2px 2px 13px}.paper-page.right{border-radius:2px 13px 13px 2px}.paper-page.active-page{box-shadow:inset 0 0 0 2px #678e782f,0 4px 7px #283a2920}.paper-header{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;color:#a49e92;font-family:Georgia,serif;font-size:12px}.writing-surface{position:absolute;inset:57px 19px 33px 23px;--rule:31px;overflow:hidden}.paper-page[data-paper="lined"] .writing-surface{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--rule) - 1px),#a5c6de81 calc(var(--rule) - 1px),#a5c6de81 var(--rule))}.paper-page[data-paper="grid"] .writing-surface{--rule:26px;background-image:linear-gradient(to right,#adc3d380 1px,transparent 1px),linear-gradient(to bottom,#adc3d380 1px,transparent 1px);background-size:var(--rule) var(--rule)}.paper-editor{position:absolute;inset:0;width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;padding:0 12px 9px 12px;font-size:20px;line-height:var(--rule);color:#28456f;overflow:auto}.draw-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}.draw-canvas.interactive{pointer-events:auto;touch-action:none;cursor:crosshair}.draw-canvas.eraser{cursor:cell}.paper-page.drawing-mode .paper-editor{pointer-events:none}.page-foot{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#7f776b;letter-spacing:.2px}.cover{width:min(540px,90%);height:clamp(445px,62vh,650px);position:relative;display:flex;flex-direction:column;align-items:center;background:var(--cover);border-radius:9px 17px 17px 9px;border:1px solid #00000013;box-shadow:inset 8px 0 0 #18170f25,inset 15px 0 0 #fff2,7px 4px 0 #f1eadd,10px 8px 0 #d2cdc3,14px 14px 26px #2c382833;text-align:center;padding:0;color:#fff}.cover-top{z-index:1;font-family:Georgia,serif;letter-spacing:4px;font-size:12px;text-transform:uppercase;font-weight:700;margin-top:76px;color:#fffae9d6}.cover-sticker{z-index:1;background:#fffdf6;border:7px double #d6c8ae;color:#3e4e4a;width:74%;max-width:330px;min-height:210px;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:11px;padding:22px 17px;box-shadow:1px 5px 13px #2b291e33;transform:rotate(-1deg)}.sticker-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#9d968a}.sticker-title{font:700 clamp(25px,3vw,37px) Georgia,serif}.sticker-subject{font:italic 17px Georgia,serif;color:#7d8279}.cover-bottom{z-index:1;margin-bottom:32px;color:#ffffffe0;font-size:12px;letter-spacing:.7px}.cover-click{border:0;cursor:pointer}.nav-strip{width:min(100%,1040px);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}.nav-info{text-align:center;font-size:12px;color:#6a796f}.nav-btn{background:#fdfdf7;border:1px solid #cdd7ca;border-radius:12px;padding:10px 13px;color:#3f6150;font-weight:700}.modal-backdrop{position:fixed;inset:0;background:#1f3329a8;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-backdrop[hidden]{display:none}.modal{width:min(100%,480px);border-radius:20px;background:#fefef9;padding:26px;box-shadow:0 25px 80px #0003}.modal h2{font:700 27px Georgia,serif;margin:0 0 7px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:800;color:#4b6458}.field input,.field select{border:1px solid #cbd7ca;border-radius:9px;padding:11px 12px;background:#fff;width:100%;font-size:15px}.cover-colors{display:flex;gap:10px;flex-wrap:wrap}.cover-option{width:38px;height:38px;border-radius:10px;background:var(--color);border:3px solid transparent}.cover-option.chosen{border-color:#fff;outline:2px solid #466e58}.modal-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:18px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2f4d41;color:#fff;border-radius:12px;padding:12px 17px;box-shadow:0 13px 35px #0003;font-size:13px;z-index:110}.toast[hidden]{display:none}.mobile-only{display:none}
@media(max-width:990px){.sidebar{position:fixed;top:0;left:0;bottom:0;width:268px;transform:translateX(-110%);transition:.2s;box-shadow:10px 0 28px #0002}.sidebar.show{transform:translateX(0)}.mobile-only{display:inline-flex}}
@media(max-width:760px){.toolbar{flex-wrap:nowrap;overflow-x:auto;margin:0 12px}.stage{justify-content:flex-start;padding:20px 9px 25px}.book-spread::before{display:none}.paper-page{width:100%;height:clamp(430px,67dvh,650px);border-radius:10px!important}.cover{height:clamp(425px,65dvh,610px);width:min(92%,470px)}}
@media print{.sidebar,.topbar,.toolbar,.nav-strip,.desk-note{display:none!important}.stage{padding:0}.paper-page{page-break-after:always;width:190mm;height:270mm}.book-spread{display:block}}
</style>

<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-row"><span class="brand-icon">✎</span><span class="brand-text">Digitális füzetek</span></div><div class="brand-tag">Jegyzetek</div></div>
  <button class="btn primary wide" id="newNotebookBtn">＋ Új füzet</button>
  <p class="small-heading">Füzeteim</p>
  <div id="notebookList" class="notebook-list"></div>
  <div class="side-bottom"><strong>Automatikus helyi mentés.</strong><br>A füzetek ezen az eszközön maradnak.<br><br><a href="../">← Vissza a Tanulósarokhoz</a></div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-actions"><button class="btn mobile-only" id="menuBtn">☰</button><div class="title-container"><p class="eyebrow" id="topEyebrow">Digitális füzet · Mentve</p><h1 class="heading" id="notebookHeading"></h1><p class="subheading" id="notebookSubtitle"></p></div></div>
  <div class="top-actions"><button class="btn" id="editNotebookBtn">✎ Füzet adatai</button><button class="btn" id="exportBtn">⇩ Mentés fájlba</button><button class="btn" id="importBtn">⇧ Betöltés</button><button class="btn" id="printBtn">⎙ PDF / Nyomtatás</button></div>
</header>
<section class="toolbar">
<div class="tool-group" id="modeTools"><button class="mode-btn active" data-mode="type">⌨ Gépelés</button><button class="mode-btn" data-mode="pen">✎ Toll</button><button class="mode-btn" data-mode="eraser">▱ Radír</button></div>
<div class="tool-group"><span class="tool-caption">Betű</span><select id="fontSelect"><option>Georgia</option><option>Segoe Print</option><option>Comic Sans MS</option><option>Arial</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option></select><select id="fontSizeSelect"><option>15</option><option>17</option><option selected>19</option><option>21</option><option>24</option><option>28</option></select></div>
<div class="tool-group"><span class="tool-caption">Tinta</span><input type="color" id="inkColor" class="ink-input" value="#28456f"><span class="tool-caption">Vastagság</span><input type="range" min="1" max="10" value="3" id="penWidth" class="width-input"><span id="penWidthLabel">3</span></div>
<div class="tool-group"><span class="tool-caption">Lap</span><select id="paperSelect"><option value="lined">Vonalas</option><option value="grid">Kockás</option><option value="plain">Sima</option></select></div>
<div class="tool-group"><button class="btn" id="addPagesBtn">＋ 2 lap</button></div>
</section>
<section class="stage"><p class="desk-note" id="deskNote"></p><div class="book-slot" id="bookSlot"></div><nav class="nav-strip"><button class="nav-btn" id="prevBtn">❮ Előző</button><div class="nav-info" id="navInfo"></div><div class="nav-actions"><button class="nav-btn" id="closeBtn">Becsukás</button><button class="nav-btn" id="nextBtn">Következő ❯</button></div></nav></section>
</main></div>

<div class="modal-backdrop" id="notebookModal" hidden><div class="modal"><h2 id="modalTitle">Új füzet</h2><form id="notebookForm"><div class="field"><label>Füzet neve</label><input id="nbTitleInput" maxlength="80" required></div><div class="field"><label>Alcím / tantárgy</label><input id="nbSubjectInput" maxlength="80"></div><div class="field"><label>Papírtípus</label><select id="nbPaperInput"><option value="lined">Vonalas</option><option value="grid">Kockás</option><option value="plain">Sima</option></select></div><div class="field"><label>Borító színe</label><div class="cover-colors" id="coverColors"></div></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteNotebookBtn" hidden>Törlés</button><button type="button" class="btn" id="cancelNotebookBtn">Mégsem</button><button type="submit" class="btn primary" id="saveNotebookBtn">Mentés</button></div></form></div></div>
<input id="importFile" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
(()=>{
const STORAGE_KEY='leckekucko_jegyzetek_v1', COLORS=['#6f9aa0','#d09565','#74917b','#a78da8','#8f9cb7','#c08076','#7391a3','#6c7772'], INK='#28456f';
const $=id=>document.getElementById(id),clone=v=>JSON.parse(JSON.stringify(v)),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),uid=()=> 'f_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const isMobile=()=>matchMedia('(max-width:760px)').matches;
function page(){return{text:'',strokes:[],font:'Georgia',fontSize:19,ink:INK}}
function notebook(title='Az első füzetem',subject='Jegyzetek',paper='lined',cover=COLORS[2]){return{id:uid(),title,subject,paper,cover,currentPage:0,pages:Array.from({length:12},page)}}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||{activeId:null,notebooks:[] ,settings:{mode:'type',width:3}}}catch{state={activeId:null,notebooks:[],settings:{mode:'type',width:3}}}
if(!state.notebooks?.length){const n=notebook();state.notebooks=[n];state.activeId=n.id} if(!state.settings)state.settings={mode:'type',width:3};
let isOpen=false,selectedPage=0,modalMode='new',modalColor=COLORS[2],saveTimer;
const nb=()=>state.notebooks.find(n=>n.id===state.activeId)||state.notebooks[0], active=()=>nb().pages[selectedPage];
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('topEyebrow').textContent='Digitális füzet · Mentve'},250)}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2500)}
function renderSidebar(){const r=$('notebookList');r.replaceChildren();state.notebooks.forEach(n=>{const b=document.createElement('button');b.className='notebook-item'+(n.id===state.activeId?' selected':'');b.innerHTML='<span class="mini-cover" style="--cover:'+n.cover+'"></span><span><span class="nb-title"></span><span class="nb-sub">'+n.pages.length+' oldal</span></span>';b.querySelector('.nb-title').textContent=n.title;b.onclick=()=>{state.activeId=n.id;selectedPage=n.currentPage||0;isOpen=false;render();save()};r.append(b)})}
function createPage(i,side){const n=nb(),p=n.pages[i],pg=document.createElement('section');pg.className='paper-page '+side+(i===selectedPage?' active-page':'');pg.dataset.paper=n.paper;pg.innerHTML='<div class="paper-header"><span></span><span>● Aktív lap</span></div><div class="writing-surface"><textarea class="paper-editor"></textarea><canvas class="draw-canvas"></canvas></div><div class="page-foot">'+(i+1)+'</div>';pg.querySelector('.paper-header span').textContent=n.title;const ta=pg.querySelector('textarea');ta.value=p.text;ta.style.fontFamily=p.font;ta.style.fontSize=p.fontSize+'px';ta.style.color=p.ink;ta.onfocus=()=>selectPage(i);ta.oninput=()=>{p.text=ta.value;save()};const c=pg.querySelector('canvas');initCanvas(c,p,i);pg.classList.toggle('drawing-mode',state.settings.mode!=='type');c.classList.toggle('interactive',state.settings.mode!=='type');c.classList.toggle('eraser',state.settings.mode==='eraser');pg.onclick=()=>selectPage(i);return pg}
function selectPage(i){selectedPage=i;const p=active();$('fontSelect').value=p.font;$('fontSizeSelect').value=p.fontSize;$('inkColor').value=p.ink;document.querySelectorAll('.paper-page').forEach((x,j)=>x.classList.toggle('active-page',j===i%2))}
function initCanvas(c,p,i){let drawing=false,s=null;c.onpointerdown=e=>{if(state.settings.mode==='type')return;e.preventDefault();selectPage(i);c.setPointerCapture(e.pointerId);drawing=true;if(state.settings.mode==='pen'){s={color:p.ink,width:state.settings.width,points:[pos(e,c)]};p.strokes.push(s)}else erase(e,c,p);paint(c,p)};c.onpointermove=e=>{if(!drawing)return;if(state.settings.mode==='pen'&&s){s.points.push(pos(e,c));paint(c,p)}else if(state.settings.mode==='eraser')erase(e,c,p)};c.onpointerup=()=>{drawing=false;s=null;save()};requestAnimationFrame(()=>paint(c,p))}
function pos(e,c){const b=c.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]}
function erase(e,c,p){const [x,y]=pos(e,c),b=c.getBoundingClientRect();for(let i=p.strokes.length-1;i>=0;i--){if(p.strokes[i].points.some(q=>Math.hypot((q[0]-x)*b.width,(q[1]-y)*b.height)<16)){p.strokes.splice(i,1);paint(c,p);save();break}}}
function paint(c,p){const b=c.getBoundingClientRect();if(!b.width)return;const d=Math.min(devicePixelRatio||1,2);c.width=b.width*d;c.height=b.height*d;const x=c.getContext('2d');x.scale(d,d);x.lineCap='round';x.lineJoin='round';p.strokes.forEach(s=>{x.beginPath();s.points.forEach((q,j)=>j?x.lineTo(q[0]*b.width,q[1]*b.height):x.moveTo(q[0]*b.width,q[1]*b.height));x.strokeStyle=s.color;x.lineWidth=s.width;x.stroke()})}
function renderBook(){const r=$('bookSlot');r.replaceChildren();const n=nb();if(!isOpen){const c=document.createElement('button');c.className='cover cover-click';c.style.setProperty('--cover',n.cover);c.innerHTML='<div class="cover-top">LECKEKUCKÓ · DIGITÁLIS FÜZET</div><div class="cover-sticker"><div class="sticker-label">Füzet</div><div class="sticker-title"></div><div class="sticker-subject"></div></div><div class="cover-bottom">KATTINTS A KINYITÁSHOZ →</div>';c.querySelector('.sticker-title').textContent=n.title;c.querySelector('.sticker-subject').textContent=n.subject||'Jegyzetek';c.onclick=()=>{isOpen=true;render()};r.append(c)}else{const s=document.createElement('div');s.className='book-spread';const start=isMobile()?n.currentPage:Math.floor(n.currentPage/2)*2;[start,...(!isMobile()?[start+1]:[])].filter(i=>i<n.pages.length).forEach((i,j)=>s.append(createPage(i,isMobile()?'right':j?'right':'left')));r.append(s)}renderNav()}
function renderNav(){const n=nb(),start=isMobile()?n.currentPage:Math.floor(n.currentPage/2)*2;$('prevBtn').disabled=!isOpen;$('nextBtn').disabled=!isOpen||start+(isMobile()?1:2)>=n.pages.length;$('closeBtn').disabled=!isOpen;$('navInfo').innerHTML=isOpen?'<strong>'+(start+1)+(isMobile()?'':'–'+Math.min(start+2,n.pages.length))+'. oldal</strong><br>'+n.pages.length+' oldal':'<strong>Csukott füzet</strong>'}
function render(){renderSidebar();$('notebookHeading').textContent=nb().title;$('notebookSubtitle').textContent=(nb().subject?nb().subject+' · ':'')+nb().pages.length+' oldal';$('paperSelect').value=nb().paper;$('deskNote').textContent=isOpen?'Gépelhetsz vagy rajzolhatsz az aktív lapra.':'Kattints a borítóra, és nyisd ki a füzeted.';renderBook()}
function move(d){if(!isOpen)return;const n=nb(),step=isMobile()?1:2,to=(isMobile()?n.currentPage:Math.floor(n.currentPage/2)*2)+d*step;if(to<0||to>=n.pages.length)return;n.currentPage=to;selectedPage=to;render();save()}
function colors(){const r=$('coverColors');r.replaceChildren();COLORS.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='cover-option'+(c===modalColor?' chosen':'');b.style.setProperty('--color',c);b.onclick=()=>{modalColor=c;colors()};r.append(b)})}
function modal(mode){modalMode=mode;const n=nb();$('modalTitle').textContent=mode==='new'?'Új füzet':'Füzet adatai';$('deleteNotebookBtn').hidden=mode==='new';$('nbTitleInput').value=mode==='new'?'':n.title;$('nbSubjectInput').value=mode==='new'?'':n.subject;$('nbPaperInput').value=mode==='new'?'lined':n.paper;modalColor=mode==='new'?COLORS[2]:n.cover;colors();$('notebookModal').hidden=false}
$('newNotebookBtn').onclick=()=>modal('new');$('editNotebookBtn').onclick=()=>modal('edit');$('cancelNotebookBtn').onclick=()=>$('notebookModal').hidden=true;
$('notebookForm').onsubmit=e=>{e.preventDefault();const title=$('nbTitleInput').value.trim();if(!title)return;if(modalMode==='new'){const n=notebook(title,$('nbSubjectInput').value.trim(),$('nbPaperInput').value,modalColor);state.notebooks.push(n);state.activeId=n.id;selectedPage=0;isOpen=false}else{Object.assign(nb(),{title,subject:$('nbSubjectInput').value.trim(),paper:$('nbPaperInput').value,cover:modalColor})}$('notebookModal').hidden=true;render();save()}
$('deleteNotebookBtn').onclick=()=>{if(!confirm('Biztosan törlöd ezt a füzetet?'))return;state.notebooks=state.notebooks.filter(x=>x.id!==state.activeId);if(!state.notebooks.length){const n=notebook();state.notebooks=[n]}state.activeId=state.notebooks[0].id;selectedPage=0;isOpen=false;$('notebookModal').hidden=true;render();save()}
$('prevBtn').onclick=()=>move(-1);$('nextBtn').onclick=()=>move(1);$('closeBtn').onclick=()=>{isOpen=false;render()};$('addPagesBtn').onclick=()=>{nb().pages.push(page(),page());nb().currentPage=nb().pages.length-2;selectedPage=nb().currentPage;isOpen=true;render();save()}
$('modeTools').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;state.settings.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));renderBook();save()}
$('fontSelect').onchange=e=>{active().font=e.target.value;renderBook();save()};$('fontSizeSelect').onchange=e=>{active().fontSize=clamp(+e.target.value,15,28);renderBook();save()};$('inkColor').oninput=e=>{active().ink=e.target.value;renderBook();save()};$('penWidth').oninput=e=>{state.settings.width=+e.target.value;$('penWidthLabel').textContent=e.target.value;save()};$('paperSelect').onchange=e=>{nb().paper=e.target.value;renderBook();save()}
$('exportBtn').onclick=()=>{const n=nb(),blob=new Blob([JSON.stringify({format:'leckekucko-notebook',version:1,notebook:n},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=n.title.replace(/\W+/g,'_')+'.fuzet.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Füzetmentés letöltve.')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.notebook)throw 0;const n=clone(d.notebook);n.id=uid();state.notebooks.push(n);state.activeId=n.id;selectedPage=n.currentPage||0;render();save();toast('Füzet betöltve.')}catch{toast('Nem sikerült betölteni.')}e.target.value=''}
$('printBtn').onclick=()=>window.print();$('menuBtn').onclick=()=>$('sidebar').classList.toggle('show');window.onresize=()=>renderBook();render();
})();
</script>
</body></html>
