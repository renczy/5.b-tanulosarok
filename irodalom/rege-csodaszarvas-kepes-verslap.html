<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arany János: Rege a csodaszarvasról – képes verslap</title>
<link rel="stylesheet" href="../assets/comic.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8ee;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px 14px 50px}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#172033;font-weight:900}
.hero{border:4px solid #111827;border-radius:24px;background:linear-gradient(135deg,#fff0cf,#e8f4e4);box-shadow:7px 7px 0 #111827;padding:18px;margin-bottom:18px}
.hero h1{margin:0 0 7px;font-size:clamp(1.7rem,5vw,3rem)}
.poster{border:4px solid #111827;border-radius:22px;background:#fff;box-shadow:7px 7px 0 #111827;padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}
.poster img{display:block;width:100%;height:auto;min-width:680px;border-radius:14px}
.tip{margin-top:12px;padding:10px 12px;border:2px dashed #6b7280;border-radius:12px;background:#fff}
@media(max-width:700px){.poster{padding:6px}.poster img{min-width:760px}}
</style>
<script>document.documentElement.classList.add('auth-locked')</script>
