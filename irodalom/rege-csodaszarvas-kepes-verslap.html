<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arany János: Rege a csodaszarvasról – képes verslap</title>
<link rel="stylesheet" href="../assets/comic.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8ee;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1250px;margin:auto;padding:18px 14px 60px}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;color:#172033;font-weight:900}
.hero{border:4px solid #111827;border-radius:24px;background:linear-gradient(135deg,#fff0cf,#e8f4e4);box-shadow:7px 7px 0 #111827;padding:18px;margin-bottom:18px}
.hero h1{margin:0 0 7px;font-size:clamp(1.8rem,5vw,3.2rem)}
.hero p{margin:.4rem 0;font-weight:700}
.poster{border:4px solid #111827;border-radius:22px;background:#fff;box-shadow:7px 7px 0 #111827;padding:10px;overflow:hidden}
.poster img{display:block;width:100%;height:auto;border-radius:14px}
.loading{padding:40px 20px;text-align:center;font-weight:900;color:#5d6879}
.tip{margin-top:14px;padding:12px 14px;border:2px dashed #6b7280;border-radius:12px;background:#fff;font-weight:700}
@media(max-width:700px){.poster{padding:6px}.hero{padding:15px}}
</style>
<script>document.documentElement.classList.add('auth-locked')</script>
<link rel="stylesheet" href="../assets/auth.css">
<script defer src="../assets/auth.js"></script>
</head>
<body>
<main class="wrap">
<a class="back" href="szall-a-madar-memoriter.html">← Vissza a memoriterhez</a>
<section class="hero">
<h1>Arany János: Rege a csodaszarvasról</h1>
<p>Képes verslap a tanuláshoz – a nyolc versszakhoz készített illusztrációkkal.</p>
</section>
<section class="poster">
<div id="loading" class="loading">A képes verslap betöltése…</div>
<img id="posterImg" alt="Arany János: Rege a csodaszarvasról – illusztrált képes verslap" hidden>
</section>
<div class="tip"><b>Tanulási ötlet:</b> nézd végig versszakonként a képeket, majd próbáld meg a kép alapján felmondani a hozzá tartozó négy sort.</div>
</main>
<script>
(async()=>{
  const files=[
    "assets/rege-poster-1.txt","assets/rege-poster-2.txt","assets/rege-poster-3.txt",
    "assets/rege-poster-4.txt","assets/rege-poster-5.txt","assets/rege-poster-6.txt"
  ];
  try{
    const parts=await Promise.all(files.map(p=>fetch(p,{cache:"force-cache"}).then(r=>{
      if(!r.ok) throw new Error(p);
      return r.text();
    })));
    const b64=parts.join("").replace(/\s+/g,"");
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:"image/webp"}));
    const img=document.getElementById("posterImg");
    img.onload=()=>{document.getElementById("loading").remove();img.hidden=false};
    img.src=url;
  }catch(err){
    document.getElementById("loading").textContent="A képes verslap nem tudott betöltődni. Frissítsd az oldalt.";
  }
})();
</script>
</body>
</html>
